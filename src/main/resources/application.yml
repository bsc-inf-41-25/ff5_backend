spring:
  application:
    name: ticketmaster

  datasource:
    url: jdbc:mariadb://localhost:3306/ticketmaster
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ThisIsAVeryLongSecretKeyForJWTTokenGenerationChangeInProduction1234567890
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: DEBUG

google:
  client-id: dummy-client-id-for-now.apps.googleusercontent.com