spring:
  application:
    name: ticketmaster

  datasource:
    url: jdbc:mariadb://localhost:3306/ticketmaster
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: 8080

jwt:
  secret: ThisIsAVeryLongSecretKeyForJWTTokenGenerationChangeInProduction1234567890
  expiration: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

paychangu:
  secret-key: ${PAYCHANGU_SECRET_KEY}
  base-url: https://api.paychangu.com
  callback-url: ${PAYCHANGU_CALLBACK_URL:http://localhost:8080/api/payments/callback}
  return-url: ${PAYCHANGU_RETURN_URL:http://localhost:8080/api/payments/return}
  
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO