services:
  # Database Service
  mariadb:
    image: mariadb:11.8
    container_name: ticketmaster-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ticketmaster
    ports:
      - "3306:3306"
    volumes:
      - ticketmaster_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Service
  backend:
    image: zymal/ticketmaster-backend:latest
    container_name: ticketmaster-backend
    ports:
      - "8080:8080"
    environment:
      # Database connection (MariaDB driver)
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/ticketmaster
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      
      # Secrets passed from the .env file
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PAYCHANGU_SECRET_KEY: ${PAYCHANGU_SECRET_KEY}
      
      # PayChangu Webhook URL (for completeness)
      PAYCHANGU_WEBHOOK_URL: http://localhost:8080/api/payments/webhook
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  ticketmaster_data: